[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-reconciliation-toolkit"
version = "0.1.0"
description = "Read-only transaction reconciliation for CSV files"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
reconcile-csv = "reconcile.cli:main"

[tool.setuptools.packages.find]
include = ["reconcile*"]
